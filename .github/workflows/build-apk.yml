name: Build APK

# Builds an installable Android APK and attaches it to the run as a
# downloadable artifact. Needs no local Flutter, Android SDK or Java install â€”
# push the repo and collect the APK from the Actions tab.
#
# Runs on every push, and can be triggered by hand from the Actions tab
# ("Run workflow") once the repo is up.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Report toolchain versions
        run: |
          flutter --version
          java -version

      - name: Show what actually arrived in the repo
        run: ls -la

      # Phones cannot upload folders, only individual files, so this workflow
      # accepts the whole project as a zip committed to the repo root.
      #
      # It matches ANY *.zip rather than one hard-coded name. An earlier
      # version looked for "lexicon.zip" specifically and silently did nothing
      # when the file was called "lexicon-lite.zip" -- every later step then
      # failed with a confusing "No pubspec.yaml" instead of pointing at the
      # real problem.
      - name: Unpack the project zip
        run: |
          set -eux
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)

          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            unzip -q -o "$ZIP" -d /tmp/unpacked

            # The archive may or may not have a single top-level folder.
            if [ -f /tmp/unpacked/pubspec.yaml ]; then
              SRC=/tmp/unpacked
            else
              SRC=$(find /tmp/unpacked -maxdepth 2 -name pubspec.yaml \
                    -exec dirname {} \; | head -1)
            fi

            if [ -z "$SRC" ]; then
              echo "::error::No pubspec.yaml anywhere inside $ZIP."
              find /tmp/unpacked -maxdepth 3 | head -50
              exit 1
            fi

            echo "Project root inside the archive: $SRC"
            shopt -s dotglob
            cp -rf "$SRC"/* .
            rm -f "$ZIP"
          else
            echo "No zip found; assuming the files are already laid out."
          fi

      # Fail here with a clear message rather than three steps later with a
      # misleading one.
      - name: Verify the project is present
        run: |
          set -eu
          missing=0
          for required in pubspec.yaml lib/main.dart tool/build_dictionary.py; do
            if [ ! -e "$required" ]; then
              echo "::error::Missing $required"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "--- repo root ---"; ls -la
            echo "::error::Project files are not in place. Upload the zip to the repo root, or commit the folder contents directly."
            exit 1
          fi
          echo "Project layout looks correct."
          ls -la

      # The 14 MB dictionary is the most painful thing to upload over a phone.
      # It does not have to be uploaded at all: it is a build artefact, and
      # this rebuilds it from WordNet if it is missing. NLTK fetches the corpus
      # from raw.githubusercontent.com, which CI can reach fine.
      #
      # Takes about 40 seconds. If the file is already committed, this is
      # skipped and the committed copy is used as-is.
      - name: Build the dictionary if it is not committed
        run: |
          set -eux
          if [ ! -f assets/db/dictionary.db.gz ]; then
            echo "No dictionary committed - building it from WordNet."
            python3 -m pip install --quiet nltk
            python3 tool/build_dictionary.py --out /tmp/dictionary.db
            mkdir -p assets/db
            gzip -9 -c /tmp/dictionary.db > assets/db/dictionary.db.gz
            ls -lh assets/db/dictionary.db.gz
          else
            echo "Using the committed dictionary."
            ls -lh assets/db/dictionary.db.gz
          fi

      # This repo carries lib/, assets/, test/ and three hand-written Android
      # manifests, but not the generated Gradle scaffolding -- no build.gradle,
      # no wrapper, no MainActivity. `flutter create` produces those.
      #
      # It is run into a TEMPORARY directory and only the android/ folder is
      # copied back. An earlier version ran it in place and moved lib/ and
      # pubspec.yaml aside first, which meant that if `flutter create` failed
      # the project was left gutted and every later step failed confusingly.
      # Scaffolding out-of-tree cannot damage the source at all.
      - name: Generate Android scaffolding
        run: |
          set -eux
          rm -rf /tmp/scaffold
          flutter create \
            --platforms=android \
            --org com.nand \
            --project-name lexicon \
            /tmp/scaffold

          # Keep the hand-written manifests, take everything else from the
          # generated project.
          mkdir -p /tmp/manifests
          cp -r android/app/src/. /tmp/manifests/ 2>/dev/null || true

          rm -rf android
          cp -r /tmp/scaffold/android .

          for variant in main release debug; do
            if [ -f "/tmp/manifests/$variant/AndroidManifest.xml" ]; then
              mkdir -p "android/app/src/$variant"
              cp "/tmp/manifests/$variant/AndroidManifest.xml" \
                 "android/app/src/$variant/AndroidManifest.xml"
              echo "restored $variant manifest"
            fi
          done

      # ML Kit's text recognition requires API 21 or above. Recent Flutter
      # templates already default to 21+, so this is usually a no-op â€” but it
      # is cheap insurance and handles both the Groovy and Kotlin Gradle DSLs.
      - name: Pin minSdk for ML Kit
        run: |
          set -eux
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
            grep -n 'minSdk' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
            grep -n 'minSdk' android/app/build.gradle || true
          fi

      - name: Resolve packages
        run: flutter pub get

      # Analyzer and tests are informational, not gates. This source has never
      # been compiled, so the first few runs are expected to surface real
      # errors â€” but a lint warning should not stop you getting an APK, and
      # the build step below is the honest test of whether it compiles.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run domain tests
        continue-on-error: true
        run: flutter test

      # Flutter's generated build.gradle signs release builds with the debug
      # key when no signing config is supplied, so this APK installs directly
      # on a phone. It is NOT suitable for the Play Store â€” that needs a real
      # upload key.
      - name: Build release APK
        run: flutter build apk --release

      - name: Report APK size
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      # If the release build failed, try a debug build anyway. Debug APKs are
      # larger and slower but install and run fine, and getting *something*
      # onto the phone beats getting nothing while errors are ironed out.
      - name: Fall back to a debug APK
        if: failure()
        run: |
          # Only meaningful if the project actually got as far as being a
          # project. Running this blind is what produced the misleading
          # "No pubspec.yaml file found" error that masked the real cause.
          if [ ! -f pubspec.yaml ]; then
            echo "::warning::Skipping the debug build - there is no Flutter project here."
            echo "::warning::The failure happened before the build stage. Check the earlier red step."
            exit 0
          fi
          flutter build apk --debug

      - name: Upload debug APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: ignore
